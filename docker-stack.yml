services:
  api-hsp:
    image: ghcr.io/sladesouzasantos/hsp_simulator:main
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    networks:
      greencity-net:
        aliases: [api-hsp]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  dashboard-hsp:
    image: ghcr.io/sladesouzasantos/hsp_simulator:main
    command: ["streamlit", "run", "dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.enableCORS", "false", "--server.enableXsrfProtection", "false"]
    environment:
      API_URL: http://api-hsp:8000
    networks:
      greencity-net:
        aliases: [dashboard-hsp]
    deploy:
      replicas: 1

  nginx:
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: 8090
        protocol: tcp
        mode: ingress
    volumes:
      - /app/hsp-simulator-prod/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - greencity-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  greencity-net:
    external: true
    name: greencity-net
