services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NASA_START_YEAR: "2022"
      NASA_END_YEAR: "2024"
    ports:
      - "8000:8000"
  dashboard:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      NASA_START_YEAR: "2022"
      NASA_END_YEAR: "2024"
    ports:
      - "8501:8501"
