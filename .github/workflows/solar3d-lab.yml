name: Solar 3D laboratory

on:
  push:
    branches:
      - feature/solar3d-lab
    paths:
      - "solar3d/**"
      - "tests/solar3d/**"
      - ".github/workflows/solar3d-lab.yml"
  pull_request:
    paths:
      - "solar3d/**"
      - "tests/solar3d/**"
      - ".github/workflows/solar3d-lab.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar3d/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  solar-position:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r solar3d/backend/requirements.txt pytest httpx
      - run: python -m pytest -q tests/solar3d
