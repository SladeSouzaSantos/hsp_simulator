name: Python quality
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Bundle self-hosted Three.js component
        working-directory: dashboard/components/solar3d_drag
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s editor.bundle.js
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - run: node --input-type=module --check < dashboard/components/solar3d_drag/editor.js
      - run: node --test tests/dashboard/test_scene3d_selection.mjs tests/dashboard/test_scene3d_compass.mjs
      - run: python -m pytest -q tests/dashboard/test_scene3d_assets.py
